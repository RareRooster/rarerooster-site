<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
        <linearGradient id="facet-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F2FF" />
      <stop offset="100%" stop-color="#AFCDFF" />
    </linearGradient>
    <linearGradient id="facet-l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0C8FF" />
      <stop offset="100%" stop-color="#69A0FF" />
    </linearGradient>
    <linearGradient id="facet-l3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5F96FA" />
      <stop offset="100%" stop-color="#376EE6" />
    </linearGradient>
    <linearGradient id="facet-l4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B82F0" />
      <stop offset="100%" stop-color="#2D5FD2" />
    </linearGradient>
    <linearGradient id="facet-l5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3769D7" />
      <stop offset="100%" stop-color="#1E4BAF" />
    </linearGradient>
    <linearGradient id="facet-r1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F0E6" />
    </linearGradient>
    <linearGradient id="facet-r2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEEAF" />
      <stop offset="100%" stop-color="#F8D05F" />
    </linearGradient>
    <linearGradient id="facet-r3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACD50" />
      <stop offset="100%" stop-color="#EB702D" />
    </linearGradient>
    <linearGradient id="facet-r4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0AF32" />
      <stop offset="100%" stop-color="#D78C1E" />
    </linearGradient>
    <linearGradient id="facet-r5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D78C1E" />
      <stop offset="100%" stop-color="#B96E14" />
    </linearGradient>

  </defs>
  <!-- Bezel Ring (Safe zone radius 310, Vivid Starlight Blue #5D8BF0) -->
  <circle cx="512" cy="512" r="310" fill="none" stroke="#5D8BF0" stroke-width="5" />

  <!-- Subtle North & South Anchor Ticks -->
  <line x1="512" y1="184" x2="512" y2="210" stroke="#DAEAFF" stroke-width="6" stroke-linecap="square" />
  <line x1="512" y1="814" x2="512" y2="840" stroke="#D4AF37" stroke-width="6" stroke-linecap="square" />

  <!-- Symmetrical Equator Dot Tokens (dot dot) -->
      <circle cx="202.0" cy="512.0" r="20.0" fill="#3E7BFA" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="202.0" cy="512.0" r="13.75" fill="#141E34" stroke="#4D7CD8" stroke-width="1.25" />
    <circle cx="202.0" cy="512.0" r="8.75" fill="#688ECE" />
    <circle cx="202.0" cy="512.0" r="5.0" fill="#FFFFFF" />

      <circle cx="822.0" cy="512.0" r="20.0" fill="#D4AF37" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="822.0" cy="512.0" r="13.75" fill="#241B0E" stroke="#E5C158" stroke-width="1.25" />
    <circle cx="822.0" cy="512.0" r="8.75" fill="#F8D05F" />
    <circle cx="822.0" cy="512.0" r="5.0" fill="#FFFFFF" />


  <!-- The Focal Point Star (610x610 centered at 512, 512) -->
  <g transform="translate(207, 207) scale(6.1)">
      <g id="star">
    <!-- Left Crystalline Sapphire Facets -->
    <polygon points="50.0,4.0 50.0,50.0 39.7,35.8" fill="url(#facet-l1)" />
    <polygon points="6.2,35.8 39.7,35.8 50.0,50.0" fill="url(#facet-l2)" />
    <polygon points="6.2,35.8 50.0,50.0 33.3,55.4" fill="url(#facet-l3)" />
    <polygon points="23.0,87.2 33.3,55.4 50.0,50.0" fill="url(#facet-l4)" />
    <polygon points="23.0,87.2 50.0,50.0 50.0,67.6" fill="url(#facet-l5)" />

    <!-- Right Warm Starlight Gold / Amber Facets -->
    <polygon points="50.0,4.0 60.3,35.8 50.0,50.0" fill="url(#facet-r1)" />
    <polygon points="93.8,35.8 50.0,50.0 60.3,35.8" fill="url(#facet-r2)" />
    <polygon points="93.8,35.8 66.7,55.4 50.0,50.0" fill="url(#facet-r3)" />
    <polygon points="77.0,87.2 50.0,50.0 66.7,55.4" fill="url(#facet-r4)" />
    <polygon points="77.0,87.2 50.0,67.6 50.0,50.0" fill="url(#facet-r5)" />

    <!-- Tactile Ridge Seams -->
    <path d="M 50.0,50.0 L 50.0,4.0 M 50.0,50.0 L 93.8,35.8 M 50.0,50.0 L 77.0,87.2 M 50.0,50.0 L 23.0,87.2 M 50.0,50.0 L 6.2,35.8" stroke="#F5F8FF" stroke-opacity="0.8" stroke-width="0.4" stroke-linecap="round" />

    <!-- Outer Perimeter Star Stroke -->
    <polygon points="50.0,4.0 60.3,35.8 93.8,35.8 66.7,55.4 77.0,87.2 50.0,67.6 23.0,87.2 33.3,55.4 6.2,35.8 39.7,35.8" fill="none" stroke="#FAF5FA" stroke-opacity="0.95" stroke-width="0.6" stroke-linejoin="miter" stroke-miterlimit="10" />

    <!-- Specular Core & Micro Glint Crosshair -->
    <circle cx="50.0" cy="50.0" r="1.5" fill="#FFFFFF" />
    <path d="M 43.75,50.0 L 56.25,50.0 M 50.0,43.75 L 50.0,56.25" stroke="#FFFFFF" stroke-width="0.55" stroke-linecap="round" />
  </g>

  </g>
</svg>
