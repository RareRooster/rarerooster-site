<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer Cosmic Ring with 2x Thick Pure White Border -->
  <circle
    cx="50"
    cy="50"
    r="32"
    fill="#3E7BFA"
    stroke="#FFFFFF"
    stroke-width="4"
  />
  
  <!-- Outer Accent Border -->
  <circle
    cx="50"
    cy="50"
    r="22"
    fill="#141E34"
    stroke="#4D7CD8"
    stroke-width="2"
  />
  
  <!-- Middle Luminous Ring -->
  <circle
    cx="50"
    cy="50"
    r="14"
    fill="#688ECE"
  />
  
  <!-- Inner Starlight Core -->
  <circle
    cx="50"
    cy="50"
    r="8"
    fill="#FFFFFF"
  />
</svg>
